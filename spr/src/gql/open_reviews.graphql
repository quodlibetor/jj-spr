# What every format of the listing prints. The columns only the table has are
# fetched separately; see pull_request_details.graphql.
query SearchQuery($query: String!) {
  search(query: $query, type: ISSUE, first: 100) {
    nodes {
      __typename
      ... on PullRequest {
        number
        title
        url
        reviewDecision
        # The GitHub stack the pull request is in, if any, and where in it:
        # position 1 is the one nearest the base branch.
        stackEntry {
          position
          stack {
            number
          }
        }
        # Consulted only when reviewDecision has no verdict of its own; it
        # reports states, such as COMMENTED, that reviewDecision cannot.
        reviews(last: 20) {
          nodes {
            state
          }
        }
      }
    }
  }
}
